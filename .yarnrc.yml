nodeLinker: node-modules

# CI and Netlify install with YARN_ENABLE_SCRIPTS=false and build, test and typecheck without any dependency's lifecycle
# script, so a local install needs none either.
enableScripts: false

# zod 3 has no fix for GHSA-mrhx-c7xc-m3w5 (first fixed in 4.6.6). Only @reown/appkit-wallet and @coinbase/cdp-sdk
# carry it; the app's own zod is 4.x. Remove once both depend on zod >= 4.6.6.
# decode-uri-component 0.2.x has no fix for GHSA-qr28-fpjm-wq7f (first fixed in 0.5.1, an ES-module-only release that the
# CommonJS query-string 7 cannot load). Only query-string 7, under the @walletconnect/utils 2.21 that @reown/appkit
# 1.8.24 pins, carries it. Remove once AppKit's WalletConnect packages leave query-string 7.
npmAuditIgnoreAdvisories:
  - "1243066"
  - "1243857"
