nodeLinker: node-modules

# CI and Netlify install with YARN_ENABLE_SCRIPTS=false and build, test and typecheck without any dependency's lifecycle
# script, so a local install needs none either.
enableScripts: false

# zod 3 has no fix for GHSA-mrhx-c7xc-m3w5 (first fixed in 4.6.6). Only @reown/appkit-wallet and @coinbase/cdp-sdk
# carry it; the app's own zod is 4.x. Remove once both depend on zod >= 4.6.6.
# decode-uri-component 0.2.x has no fix for GHSA-qr28-fpjm-wq7f (first fixed in 0.5.1, an ES-module-only release that the
# CommonJS query-string 7 cannot load). Only query-string 7 carries it, under the @walletconnect/utils 2.21 that
# @walletconnect/ethereum-provider 2.21.1 pins for @wagmi/connectors 6.2.0 (forced by the root resolution);
# @reown/appkit 1.8.24 itself uses WalletConnect 2.23.7. Remove once the app leaves @wagmi/connectors 6 (the move to
# wagmi 3).
# picomatch has no fix for GHSA-fc5q-39xc-vjpf (every release up to 4.0.7, the latest, is affected). Only build and test
# tooling (vite, vitest, tinyglobby, node-gyp) and unstorage's Node-only file driver under WalletConnect carry it; none
# of it reaches the browser bundle or matches an untrusted glob. Remove once picomatch publishes a fixed release.
npmAuditIgnoreAdvisories:
  - "1243066"
  - "1243857"
  - "1247710"
