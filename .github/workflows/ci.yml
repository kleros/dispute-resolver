# Continuous integration for the rewrite (docs/parity/README.md "CI gates"; checklist A20, B22, C9, C14).
# Pull requests and pushes to the integration branch and master run the same gates. The Playwright golden-case suite and
# the RPC pre-flight need live chains and secrets, so they run on demand against the branch deploy and are not part of this workflow.
name: CI

on:
  pull_request:
    branches: [feat/rewrite, master]
  push:
    branches: [feat/rewrite, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2

      - name: Enable Yarn 4.9.2 through Corepack
        run: |
          corepack enable
          test "$(yarn --version)" = "4.9.2"

      - name: Install dependencies from the lockfile
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Check the production bundle
        run: yarn check:bundle

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2

      - name: Enable Yarn 4.9.2 through Corepack
        run: |
          corepack enable
          test "$(yarn --version)" = "4.9.2"

      - name: Install dependencies from the lockfile
        run: yarn install --immutable --mode=skip-build

      - name: Fail on high or critical advisories
        run: yarn npm audit --all --recursive --severity high
