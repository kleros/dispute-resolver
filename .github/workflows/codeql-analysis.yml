# CodeQL code scanning (checklist A21): pushes and pull requests to the integration branch, master and legacy, plus a weekly run.
# JavaScript and TypeScript need no build, so the analysis reads the sources directly.
name: "CodeQL"

on:
  push:
    branches: [feat/rewrite, master, legacy]
  pull_request:
    branches: [feat/rewrite, master]
  schedule:
    - cron: "28 6 * * 4"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
