[build]
  command = "yarn build"
  publish = "packages/web/dist"

[build.environment]
  NODE_VERSION = "22.23.2"
  YARN_VERSION = "4.9.2"
  CI = "true"
  # Dependencies install with lifecycle scripts disabled, as in CI: the build needs none of them, and this environment holds the RPC keys.
  YARN_ENABLE_SCRIPTS = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
